<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="城北埼玉 けやき祭 スクールバスのご案内。学校へ行く時刻、学校から帰る時刻、乗り場の場所をご案内します。">
  <meta name="robots" content="noindex">
  <title>けやき祭 スクールバスのご案内</title>
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/type.css">
  <link rel="stylesheet" href="/public.css">
</head>
<body>
  <!-- 地。ひと続きの面です。白から柿色、藍へ。進めるのはスクロールで、
       最後にヒーローの下で白へ明けます。ガラスはこの面を屈折させます。 -->
  <div class="sky" id="sky" aria-hidden="true">
    <i></i><i></i><i></i>
    <b class="wash wash-kaki"></b>
    <b class="wash wash-ai"></b>
  </div>

  <a class="skip-link" href="#choices">バスの時刻へ移動</a>

  <!-- 序。スクロールで綴ります。
       城北埼玉／けやき祭（縦・グラデーション） → 跳ぶ姿 → GO BEYOND → 委員長のお言葉 -->
  <section class="prologue" id="prologue">
    <div class="pro-name">
      <p class="pro-school">城北埼玉</p>
      <h1 class="pro-fes" id="proFes">けやき祭</h1>
      <div class="pro-fireworks" aria-hidden="true">

        <svg class="fw fw-b" viewBox="0 0 200 200" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-linecap="round"><line pathLength="1" style="--d:0.062s" x1="110.3" y1="99.6" x2="158.5" y2="97.5" stroke-width="3.6"/><line pathLength="1" style="--d:0.019s" x1="109.8" y1="104.1" x2="157.9" y2="124.2" stroke-width="3.6"/><line pathLength="1" style="--d:0.091s" x1="109.1" y1="107.4" x2="149.3" y2="139.7" stroke-width="2.6"/><circle style="--d:0.417s" cx="157.3" cy="146.1" r="2.5" stroke="none"/><line pathLength="1" style="--d:0.080s" x1="104.8" y1="111.7" x2="118.7" y2="146.2" stroke-width="2.6"/><line pathLength="1" style="--d:0.096s" x1="99.4" y1="110.5" x2="97.2" y2="147.8" stroke-width="3.6"/><circle style="--d:0.453s" cx="96.6" cy="157.1" r="1.4" stroke="none"/><line pathLength="1" style="--d:0.058s" x1="96.9" y1="110.4" x2="86.4" y2="146.4" stroke-width="3.6"/><line pathLength="1" style="--d:0.013s" x1="89.6" y1="108.3" x2="60.5" y2="131.6" stroke-width="2.6"/><line pathLength="1" style="--d:0.062s" x1="89.5" y1="104.8" x2="42.3" y2="126.4" stroke-width="2.6"/><line pathLength="1" style="--d:0.102s" x1="89.9" y1="99.3" x2="43.4" y2="96.1" stroke-width="3.6"/><line pathLength="1" style="--d:0.011s" x1="90.3" y1="96.0" x2="45.0" y2="77.5" stroke-width="3.6"/><line pathLength="1" style="--d:0.094s" x1="92.3" y1="91.5" x2="60.8" y2="56.6" stroke-width="2.6"/><circle style="--d:0.418s" cx="56.6" cy="52.0" r="2.7" stroke="none"/><line pathLength="1" style="--d:0.085s" x1="96.7" y1="90.2" x2="80.9" y2="42.9" stroke-width="3.6"/><line pathLength="1" style="--d:0.068s" x1="100.1" y1="89.7" x2="100.5" y2="56.8" stroke-width="2.6"/><line pathLength="1" style="--d:0.004s" x1="104.8" y1="87.9" x2="122.2" y2="44.1" stroke-width="2.6"/><circle style="--d:0.426s" cx="126.4" cy="33.4" r="1.9" stroke="none"/><line pathLength="1" style="--d:0.117s" x1="109.2" y1="91.0" x2="131.6" y2="69.1" stroke-width="3.6"/><line pathLength="1" style="--d:0.069s" x1="111.1" y1="96.3" x2="157.1" y2="81.0" stroke-width="2.6"/></svg>
        <svg class="fw fw-c" viewBox="0 0 200 200" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-linecap="round"><line pathLength="1" style="--d:0.101s" x1="113.3" y1="98.8" x2="154.6" y2="94.9" stroke-width="3.0"/><circle style="--d:0.500s" cx="160.6" cy="94.4" r="1.6" stroke="none"/><line pathLength="1" style="--d:0.102s" x1="113.9" y1="103.5" x2="161.4" y2="115.5" stroke-width="4.0"/><circle style="--d:0.442s" cx="173.9" cy="118.6" r="1.8" stroke="none"/><line pathLength="1" style="--d:0.058s" x1="110.3" y1="108.9" x2="148.4" y2="141.9" stroke-width="3.0"/><line pathLength="1" style="--d:0.066s" x1="107.4" y1="111.4" x2="136.7" y2="156.4" stroke-width="4.0"/><line pathLength="1" style="--d:0.120s" x1="103.1" y1="112.1" x2="115.4" y2="161.2" stroke-width="4.0"/><line pathLength="1" style="--d:0.057s" x1="99.7" y1="113.4" x2="98.5" y2="160.5" stroke-width="4.0"/><circle style="--d:0.369s" cx="98.2" cy="168.5" r="2.3" stroke="none"/><line pathLength="1" style="--d:0.084s" x1="93.1" y1="113.6" x2="75.6" y2="148.3" stroke-width="2.2"/><line pathLength="1" style="--d:0.124s" x1="92.3" y1="109.2" x2="60.4" y2="147.4" stroke-width="2.2"/><line pathLength="1" style="--d:0.092s" x1="86.3" y1="107.5" x2="37.9" y2="133.8" stroke-width="3.0"/><line pathLength="1" style="--d:0.094s" x1="87.0" y1="102.4" x2="41.9" y2="110.8" stroke-width="3.0"/><circle style="--d:0.464s" cx="30.2" cy="113.0" r="1.4" stroke="none"/><line pathLength="1" style="--d:0.015s" x1="86.0" y1="98.1" x2="37.7" y2="91.7" stroke-width="3.0"/><line pathLength="1" style="--d:0.005s" x1="86.3" y1="93.5" x2="52.7" y2="77.5" stroke-width="4.0"/><line pathLength="1" style="--d:0.106s" x1="91.5" y1="91.5" x2="57.0" y2="57.2" stroke-width="2.2"/><circle style="--d:0.554s" cx="52.1" cy="52.4" r="2.2" stroke="none"/><line pathLength="1" style="--d:0.024s" x1="95.7" y1="89.0" x2="81.1" y2="51.9" stroke-width="2.2"/><line pathLength="1" style="--d:0.011s" x1="98.5" y1="88.5" x2="93.3" y2="47.9" stroke-width="4.0"/><line pathLength="1" style="--d:0.129s" x1="102.5" y1="85.1" x2="110.1" y2="39.4" stroke-width="4.0"/><line pathLength="1" style="--d:0.031s" x1="108.6" y1="88.9" x2="131.4" y2="59.4" stroke-width="2.2"/><circle style="--d:0.339s" cx="135.1" cy="54.7" r="1.7" stroke="none"/><line pathLength="1" style="--d:0.058s" x1="109.8" y1="91.8" x2="152.8" y2="55.7" stroke-width="4.0"/><line pathLength="1" style="--d:0.002s" x1="113.8" y1="94.6" x2="169.5" y2="72.7" stroke-width="3.0"/></svg>
      </div>
      <div class="pro-side">
        <div class="pro-days" id="proDays" hidden></div>
      </div>
    </div>

    <!-- 跳ぶ姿と GO BEYOND はひと組です。題字は足もとから始まり、
         人物に重なったところだけ、人物が透けて見える切り抜きになります。 -->
    <section class="pro-leap" id="proLeap">
      <figure class="pro-form">
        <!-- オーロラ。人物より奥、Go Beyond の後ろに広がります。 -->
        <span class="pro-glow" aria-hidden="true"></span>
        <img class="leap" id="leap" src="/assets/brand/student-leap.webp" alt="跳び上がる生徒" width="900" height="1200">
        <!-- この段は人物だけを含みます。GO BEYOND はこの中で反転合成されるので、
             人物に重なった部分だけ色が反転し、地の柿色の上では元の色のまま出ます。 -->
        <span class="beyond-band" id="beyondBand" aria-hidden="true"></span>
        <div class="beyond-line" id="beyondLine">
          <p class="beyond-mark" id="beyondMark">Go Beyond</p>
        </div>
      </figure>
    </section>

    <blockquote class="pro-word" id="proWord"></blockquote>
  </section>

  <!-- ヒーロー。序の藍がそのまま続き、ここで白へ明けて案内へ渡します。
       見せ場は日付です。来場日を選ぶことが最初の動作なので、数字を大きく置きます。 -->
  <!-- 案内の入口。写真を全面に、縦書きの題だけ。日付はこの先の見出しで選びます。 -->
  <header class="hero" id="hero">
    <div class="hero-photo" id="heroPhoto" role="img"
         aria-label="城北埼玉学園のスクールバス"></div>
    <h2 class="hero-mark">バス案内</h2>
    <a class="hero-down" href="#choices"><span>案内へ</span></a>
  </header>

  <!-- ここから案内。白い面を自分で持ちます。
       空の色が白へ戻るのを待つと、丈のかげんで濃い文字が濃紺に乗ることがあるためです。 -->
  <div class="guide">
    <div class="daybar" id="dayBar" role="group" aria-label="来場日"></div>
    <div class="linebar" id="lineBar" hidden></div>
    <div class="notices" id="notices" hidden></div>

  <main class="wrap">
    <h2 class="lead" id="choicesHeading">どちらをお調べですか</h2>

    <div class="choices" id="choices">
      <section class="choice" data-mode="inbound">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyInbound">
          <span class="choice-face">
            <span class="choice-text">
              <strong>学校へ行く</strong>
              <small>着きたい時刻から便をお選びします</small>
            </span>
            <span class="choice-meta">
              <span class="route"><b>駅</b><i>から</i><b>学校</b><i>へ</i></span>
              <span class="choice-mark" aria-hidden="true"></span>
            </span>
        </button>
        <div class="choice-body" id="bodyInbound" hidden></div>
      </section>

      <section class="choice" data-mode="outbound">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyOutbound">
          <span class="choice-face">
            <span class="choice-text">
              <strong>学校から帰る</strong>
              <small>出発時刻の便と最終便をご案内します</small>
            </span>
            <span class="choice-meta">
              <span class="route"><b>学校</b><i>から</i><b>駅</b><i>へ</i></span>
              <span class="choice-mark" aria-hidden="true"></span>
            </span>
        </button>
        <div class="choice-body" id="bodyOutbound" hidden></div>
      </section>

      <section class="choice" data-mode="timetable">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyTimetable">
          <span class="choice-face">
            <span class="choice-text">
              <strong>時刻表をすべて見る</strong>
              <small>その日の全便を一覧でご覧いただけます</small>
            </span>
            <span class="choice-meta">
              <span class="count" data-count="trips"></span>
              <span class="choice-mark" aria-hidden="true"></span>
            </span>
        </button>
        <div class="choice-body" id="bodyTimetable" hidden></div>
      </section>

      <section class="choice" data-mode="stops">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyStops">
          <span class="choice-face">
            <span class="choice-text">
              <strong>乗り場をさがす</strong>
              <small>駅のどこから乗るかを地図でご案内します</small>
            </span>
            <span class="choice-meta">
              <span class="count" data-count="stops"></span>
              <span class="choice-mark" aria-hidden="true"></span>
            </span>
        </button>
        <div class="choice-body" id="bodyStops" hidden></div>
      </section>

      <section class="choice" data-mode="event">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyEvent">
          <span class="choice-face">
            <span class="choice-text">
              <strong>催しに合わせて調べる</strong>
              <small>催しの時間に合わせて便をお選びします</small>
            </span>
            <span class="choice-meta">
              <span class="count" data-count="programs"></span>
              <span class="choice-mark" aria-hidden="true"></span>
            </span>
        </button>
        <div class="choice-body" id="bodyEvent" hidden></div>
      </section>
    </div>

    <p class="foot" id="updatedLabel"></p>
    <p class="foot-staff"><a href="/staff">職員用の画面</a></p>
  </main>
  </div>

  <script src="/public.js" defer></script>
</body>
</html>
