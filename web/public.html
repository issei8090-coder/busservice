<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="学校へ行く時刻、学校から帰る時刻、乗り場の場所をご案内します。">
  <meta name="robots" content="noindex">
  <title>スクールバスのご案内</title>
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/public.css">
</head>
<body>
  <a class="skip-link" href="#choices">案内へ移動</a>

  <header class="appbar">
    <div class="inner">
      <div class="appbar-title">
        <h1>スクールバス</h1>
        <p id="eventLabel">ご案内</p>
      </div>
      <a class="appbar-link" href="/staff">職員用</a>
    </div>
  </header>

  <div class="linebar" id="lineBar" hidden></div>
  <div class="notices" id="notices" hidden></div>

  <main class="wrap">
    <div class="daybar" id="dayBar" role="group" aria-label="日付" hidden></div>

    <h2 class="lead" id="choicesHeading">どちらをお調べですか</h2>

    <div class="choices" id="choices">
      <section class="choice" data-mode="inbound">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyInbound">
          <span class="choice-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 18h16M6 8h12v6H6zM8 18v2m8-2v2M12 3v3m0 0-2-2m2 2 2-2"/></svg>
          </span>
          <span class="choice-text">
            <strong>学校へ行く</strong>
            <small>駅から学校までのバスをお調べします</small>
          </span>
          <span class="choice-mark" aria-hidden="true"></span>
        </button>
        <div class="choice-body" id="bodyInbound" hidden></div>
      </section>

      <section class="choice" data-mode="outbound">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyOutbound">
          <span class="choice-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 18h16M6 8h12v6H6zM8 18v2m8-2v2M12 6V3m0 3 2-2m-2 2-2-2"/></svg>
          </span>
          <span class="choice-text">
            <strong>学校から帰る</strong>
            <small>学校から駅までのバスと最終便をご案内します</small>
          </span>
          <span class="choice-mark" aria-hidden="true"></span>
        </button>
        <div class="choice-body" id="bodyOutbound" hidden></div>
      </section>

      <section class="choice" data-mode="timetable">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyTimetable">
          <span class="choice-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM5 10h14M9 3v4m6-4v4"/></svg>
          </span>
          <span class="choice-text">
            <strong>時刻表をすべて見る</strong>
            <small>その日のバスの時刻を一覧でご覧いただけます</small>
          </span>
          <span class="choice-mark" aria-hidden="true"></span>
        </button>
        <div class="choice-body" id="bodyTimetable" hidden></div>
      </section>

      <section class="choice" data-mode="stops">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyStops">
          <span class="choice-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </span>
          <span class="choice-text">
            <strong>乗り場をさがす</strong>
            <small>駅のどこから乗るかを地図でご確認いただけます</small>
          </span>
          <span class="choice-mark" aria-hidden="true"></span>
        </button>
        <div class="choice-body" id="bodyStops" hidden></div>
      </section>

      <section class="choice" data-mode="event">
        <button type="button" class="choice-head" aria-expanded="false" aria-controls="bodyEvent">
          <span class="choice-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11zM9 20v-6h6v6"/></svg>
          </span>
          <span class="choice-text">
            <strong>催しに合わせて調べる</strong>
            <small>見たい催しの時間に合わせてバスをお選びします</small>
          </span>
          <span class="choice-mark" aria-hidden="true"></span>
        </button>
        <div class="choice-body" id="bodyEvent" hidden></div>
      </section>
    </div>

    <p class="foot" id="updatedLabel"></p>
  </main>

  <script src="/public.js" defer></script>
</body>
</html>
